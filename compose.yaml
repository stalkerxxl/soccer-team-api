name: soccer-team-api
services:
  postgres:
    image: postgres:18.3-alpine3.23
    container_name: soccer-team-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      target: migrator
    container_name: soccer-team-api-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    container_name: soccer-team-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      HTTP_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
